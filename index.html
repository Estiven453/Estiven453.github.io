<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estiven Chiluisa | Perfil</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      max-width: 600px;
      width: 100%;
      padding: 32px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    h1 {
      color: #58a6ff;
      margin-bottom: 8px;
    }
    p {
      color: #8b949e;
      font-size: 1.1rem;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      color: #ffffff;
      background-color: #238636;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #2ea043;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Estiven Chiluisa</h1>
    <p>Estudiante de Ingeniería de Software</p>
    <p>Bienvenido a mi sitio web alojado en GitHub Pages.</p>
    <a href="https://github.com/Estiven453" class="btn">Ver perfil de GitHub</a>
  </div>
</body>
</html>
